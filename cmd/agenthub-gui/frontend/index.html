<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agenthub</title>
    <script>
      /*
       * Theme bootstrap (docs/docs/modules/gui.md).
       *
       * This runs INLINE in <head>, before the stylesheet is applied and
       * before the first paint. Doing it from the module bundle instead
       * would flash the default palette for a frame every launch, which on a
       * desktop window reads as a broken app rather than a slow one.
       *
       * Three states, one stored value:
       *   "light" / "dark" — an explicit choice, honoured forever;
       *   "system"        — follow the OS, which is also the default when
       *                     nothing has been stored (and after a reset).
       *
       * The resolved answer is written to data-theme; the CHOICE is written
       * to data-theme-mode so the Settings control can render which of the
       * three is selected without a second source of truth. Everything is
       * wrapped in try/catch: localStorage throws in some embedded webview
       * configurations and a theme preference must never stop the app from
       * starting.
       */
      (function () {
        var mode = "system";
        try {
          var saved = localStorage.getItem("agenthub.theme");
          if (saved === "light" || saved === "dark" || saved === "system") mode = saved;
        } catch (e) {
          /* storage unavailable: fall back to following the system */
        }
        var dark = mode === "dark";
        if (mode === "system") {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            dark = true;
          }
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.setAttribute("data-theme-mode", mode);
      })();
    </script>
  </head>
  <body>
    <div class="shell">
      <nav class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M8.4 11.2 15.5 8M8.4 12.8l7.1 3.2"/></svg>
          </span>
          <span class="brand-copy">
            <strong>agenthub</strong>
            <small>MCP control plane</small>
          </span>
        </div>
        <div class="nav-scroll">
          <div class="nav-group">Core</div>
          <a class="nav" href="#/servers" data-route="servers">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h7M11 17h7"/></svg></span><span>Servers</span>
          </a>
          <!-- Catalog remains a first-class destination and sits immediately
               below Servers: it is the discovery half of the same task. -->
          <a class="nav" href="#/catalog" data-route="catalog">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span>Catalog</span>
          </a>
          <a class="nav" href="#/playground" data-route="playground">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/><path d="M4 5v14"/></svg></span><span>Playground</span>
          </a>
          <div class="nav-group">Access</div>
          <a class="nav" href="#/profiles" data-route="profiles">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.8 2.8 8.3 7 10 4.2-1.7 7-5.2 7-10V6l-7-3Z"/><circle cx="12" cy="10" r="2.5"/><path d="M8.5 16c.8-1.5 2-2.2 3.5-2.2s2.7.7 3.5 2.2"/></svg></span><span>Profiles</span>
          </a>
          <a class="nav" href="#/clients" data-route="clients">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg></span><span>Clients</span>
          </a>
          <div class="nav-group">System</div>
          <a class="nav" href="#/settings" data-route="settings">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg></span><span>Settings</span>
          </a>
        </div>
        <!-- Two lines, not one: "daemon <version> · pid <n>" does not fit the
             sidebar and was being clipped mid-word, so the one thing this
             footer exists to answer — is it connected — was the part that got
             cut. The state word leads; the build and pid are detail. -->
        <div class="daemon" id="daemon-status">
          <span class="dot" id="daemon-dot"></span>
          <span class="daemon-lines">
            <span id="daemon-text">connecting…</span>
            <span class="daemon-detail" id="daemon-detail"></span>
          </span>
        </div>
      </nav>
      <main class="content">
        <div class="connection-banner" id="connection-banner" role="status" hidden>
          <span class="connection-banner-icon" aria-hidden="true">!</span>
          <span>
            <strong>AgentHub daemon is offline.</strong>
            Configuration and runtime state cannot be read until it reconnects.
          </span>
          <a class="btn btn-sm" href="#/settings">Open Settings</a>
        </div>
        <div class="content-view" id="view"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
