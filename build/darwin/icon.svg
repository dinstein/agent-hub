<?xml version="1.0" encoding="UTF-8"?>
<!--
  AgentHub icon: many clients converge on one hub.

  The mark is the product's one-line definition drawn literally — several
  callers (Claude Code, Cursor, Codex, …) reaching one shared centre, rather
  than each holding its own configuration and credentials.

  The centre is a rounded square, not a circle: it echoes the app window and
  keeps the silhouette readable when macOS masks it into the squircle.

  ONE MARK, TWO EXPOSURES. This drawing is the large end of a ladder whose
  small end is the tray glyph and the sidebar mark (trayicon.go, .brand-mark).
  What keeps those one mark rather than three is that SHRINKING IS SUBTRACTION:
  the six nodes sit on the vertices of one hexagon, and the three drawn SOLID —
  up, lower-right, lower-left — are exactly the three those two keep. The
  hollow three are the ones that go. Weight and survival therefore give one
  answer instead of two; an earlier version made the bottom node solid and the
  lower-left one hollow, so the reduced mark read as a different drawing rather
  than as this one seen from further away.

  The subtraction is a rule for the two hand-drawn small marks, not for this
  file's own small variants: iconutil and wails3 derive 16px and 32px by
  downsampling the drawing below, so the Dock's smallest sizes still carry six
  nodes, blurred. Splitting the ladder there would mean a second source file
  and a rasterizer that can be told which one to use per size, and the icon is
  not seen at 16px often enough to buy that.

  THE HUB IS SOLID, always. Hollow is not decoration here — the tray spends it
  on a state, where a hub with a hole in it means "serving nothing". A centre
  punched out of THIS file said exactly that, in the Dock, permanently.

  COLOUR. The identity hue is the interface's own accent indigo (style.css's
  accent token). This file used to carry a teal instead, reasoning that the GUI
  gives every hue a health meaning so an icon must borrow one the interface
  does not own. That reasoning is retired deliberately: it is what split the
  icon from the product it belongs to, leaving the Dock, the menu bar and the
  sidebar each with a different mark. The teal was a poor loan besides —
  #5ee0c8 sits beside the success green #3bcb7a, so it could never come back
  inside without reading as a health claim. Indigo is already the one hue
  style.css reserves for identity and interaction and never for health, which
  makes it the only hue the mark can wear in all three places at once.

  Note for the next editor: an XML comment may not contain a double hyphen, so
  the CSS custom properties are named here without their leading dashes. Break
  that and qlmanage renders an error page, which make-icns.sh will package as
  the application icon without complaint.

  Drawn at 1024×1024, the largest size macOS asks for; every smaller variant
  is downsampled from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- The ground is the application's own two darkest surfaces, panel over
         bg: the icon is made of the window it opens. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8b1ff"/>
      <stop offset="100%" stop-color="#5365e8"/>
    </linearGradient>
    <!-- The hairline that keeps the mark from dissolving into a dark Dock. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Canvas. 190 ≈ the 22.37% corner radius Apple's grid uses, so the shape
       already looks right before the system mask is applied. -->
  <rect width="1024" height="1024" rx="190" fill="url(#bg)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="187" fill="none"
        stroke="url(#rim)" stroke-width="8"/>

  <!-- Spokes, drawn under the nodes so the joins stay clean.
       Weight is set for the SMALL sizes: at 16px a 26px stroke disappears and
       the mark reads as loose dots. 38px survives the downsample, and the
       large sizes can carry a heavier line without looking clumsy. The three
       carrying a solid node are the loud ones. -->
  <g stroke="#7c8cff" stroke-width="38" stroke-linecap="round" fill="none">
    <g opacity="0.95">
      <path d="M512 512 L512 250"/>
      <path d="M512 512 L738 642"/>
      <path d="M512 512 L286 642"/>
    </g>
    <g opacity="0.40">
      <path d="M512 512 L286 382"/>
      <path d="M512 512 L738 382"/>
      <path d="M512 512 L512 774"/>
    </g>
  </g>

  <!-- Client nodes, on the vertices of one hexagon. Solid: the three the tray
       and the sidebar keep. Hollow: the three that drop away below 32px. -->
  <g fill="#8f9dff">
    <circle cx="512" cy="250" r="62"/>
    <circle cx="738" cy="642" r="62"/>
    <circle cx="286" cy="642" r="62"/>
  </g>
  <g fill="#0b0d12" stroke="#7c8cff" stroke-width="22" opacity="0.9">
    <circle cx="286" cy="382" r="52"/>
    <circle cx="738" cy="382" r="52"/>
    <circle cx="512" cy="774" r="52"/>
  </g>

  <!-- The hub. Sized to read as the anchor at 16px, where the spokes have
       already blurred into a halo — so it is the one element that must not be
       subtle. The dark keyline separates it from the spokes converging under
       it; without it the centre and the lines merge into one indigo blob. It
       is drawn first and painted over rather than stroked on top, so all of it
       falls outside the hub and none of the hub's width is eaten. -->
  <rect x="376" y="376" width="272" height="272" rx="74" fill="none"
        stroke="#0b0d12" stroke-width="44"/>
  <rect x="376" y="376" width="272" height="272" rx="74" fill="url(#core)"/>
</svg>
