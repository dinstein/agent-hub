version: "2"

# Four dependency-direction constraints are frozen in canonical.md §2 and are
# CI failure conditions. Each rule below has a test proving it actually fires
# (internal/depguardtest). Do not weaken them without updating canonical.md.
linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # Rule 1: GUI and public api package must not import internal/*.
        # "GUI is optional" is a compile-time constraint, not a convention.
        gui-and-api-no-internal:
          files:
            - "**/api/**"
            - "**/cmd/agenthub-gui/**"
          deny:
            - pkg: github.com/dinstein/agent-hub/internal
              desc: cmd/agenthub-gui and api must not import internal/* (canonical.md §2 rule 1)

        # Rule 2a: internal/mcp is the sole MCP protocol facade and is fully
        # self-implemented on the standard library only (ruling #32).
        mcp-stdlib-only:
          files:
            - "**/internal/mcp/**"
          allow:
            - $gostd
            - github.com/dinstein/agent-hub/internal/mcp

        # Rule 2b: no package outside internal/mcp may import a third-party
        # MCP library — the protocol facade is unique.
        no-third-party-mcp-libs:
          files:
            - "**/*.go"
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: third-party MCP libraries are forbidden; internal/mcp is the sole facade (canonical.md §2 rule 2)
            - pkg: github.com/mark3labs/mcp-go
              desc: third-party MCP libraries are forbidden; internal/mcp is the sole facade (canonical.md §2 rule 2)
            - pkg: github.com/metoro-io/mcp-golang
              desc: third-party MCP libraries are forbidden; internal/mcp is the sole facade (canonical.md §2 rule 2)

        # Rule 3: the data plane must not depend on the control plane.
        pipeline-no-ctlapi:
          files:
            - "**/internal/pipeline/**"
          deny:
            - pkg: github.com/dinstein/agent-hub/internal/ctlapi
              desc: internal/pipeline must not import internal/ctlapi (canonical.md §2 rule 3)

        # Rule 4: zero-business-dependency foundations. platform / logx /
        # guard/* sit below every business package (internal/mcp is covered
        # by the stricter mcp-stdlib-only rule above).
        platform-zero-dep:
          files:
            - "**/internal/platform/**"
          allow:
            - $gostd
            - github.com/dinstein/agent-hub/internal/platform
        logx-zero-dep:
          files:
            - "**/internal/logx/**"
          allow:
            - $gostd
            - github.com/dinstein/agent-hub/internal/logx
        guard-zero-dep:
          files:
            - "**/internal/guard/**"
          allow:
            - $gostd
            - github.com/dinstein/agent-hub/internal/guard

formatters:
  enable:
    - gofmt
    - goimports
