name: release

# Tag-triggered. The tag is the trigger AND the claim about what is being
# released, so the first job checks the tag against the VERSION file before
# anything is built: a Release whose assets disagree with its title is
# discovered by a user, months later, and is close to impossible to diagnose
# from the outside.
on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed end to end without creating a tag. The publish
  # step stays disabled on this path — see its `if`.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tagged: ${{ steps.v.outputs.tagged }}
    steps:
      - uses: actions/checkout@v5
      # Half-configured is worse than not configured at all, and this job gates
      # roughly twenty minutes of building: with HOMEBREW_TAP_REPO set somebody
      # is expecting the tap to be updated, so a missing token has to be said
      # here rather than after the DMG is packaged.
      #
      # It does not gate the Release itself. The artifacts go to this
      # repository, which the workflow's own GITHUB_TOKEN can write — the tap
      # token buys nothing but the tap.
      - name: Require the tap token when a tap is configured
        env:
          TAP: ${{ vars.HOMEBREW_TAP_REPO }}
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TAP}" ] && [ -z "${TOKEN}" ]; then
            echo "HOMEBREW_TAP_REPO is ${TAP} but HOMEBREW_TAP_TOKEN is empty" >&2
            echo "add a repository secret holding a token with contents:write on the tap," >&2
            echo "or clear the variable to turn tap publishing off" >&2
            exit 1
          fi
          if [ -z "${TAP}" ]; then
            echo "::warning::HOMEBREW_TAP_REPO is unset: the Release is published, and the tap keeps serving whatever it served before"
          fi
      - name: Check the tag matches VERSION
        id: v
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "dry run at VERSION=${version}; publish step will be skipped"
            exit 0
          fi
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} disagrees with VERSION ${version}" >&2
            echo "bump VERSION and re-tag, or tag v${version}" >&2
            exit 1
          fi

  # Pure Go, no cgo: one runner cross-compiles every platform. This is the
  # artifact for people who only use Claude Code / Cursor and never open a GUI.
  cli:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Version stamping reads the commit hash, which needs history.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Build every platform
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        # One implementation, shared with the local release path. The loop
        # used to live inline here, which meant the ldflags that decide the
        # data CHANNEL existed in two places that had to agree by hand.
        run: scripts/build-release-artifacts.sh "${RELEASE_VERSION}"
      - uses: actions/upload-artifact@v5
        with:
          name: cli
          path: dist/*
          retention-days: 7

  # The GUI must be built on the platform it targets — for macOS.
  # Windows is the exception: WebView2 is loaded at runtime through COM and the
  # wails v3 Windows backend is pure Go, so the full zip builds on any host.
  # A separate job keeps the two build shapes easy to read and diff.
  gui-macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: cmd/agenthub-gui/frontend/package-lock.json
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.118
      # Same reason as ci.yml: gui_main.go embeds frontend/dist, which is
      # gitignored, so every Go step fails to load the package until it exists.
      - name: Frontend (typecheck + bundle)
        run: make gui-frontend-ci
      - name: Package the DMG
        run: make release-macos
      - name: Checksums
        run: cd dist && shasum -a 256 *.dmg > checksums-macos.txt
      - uses: actions/upload-artifact@v5
        with:
          name: gui-macos
          path: |
            dist/*.dmg
            dist/checksums-macos.txt
          retention-days: 7

  # Cross-compiled on ubuntu-latest — WebView2 is runtime COM, no cgo needed.
  # The runner is Linux not macOS, so `sha256sum` rather than `shasum -a 256`.
  gui-windows:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: cmd/agenthub-gui/frontend/package-lock.json
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.118
      # The same reason as ci.yml and gui-macos: gui_main.go embeds
      # frontend/dist, which is gitignored. `npm ci` rejects a stale lockfile.
      - name: Frontend (typecheck + bundle)
        run: make gui-frontend-ci
      - name: Package the Windows zips (amd64 + arm64)
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: make release-windows
      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip > checksums-windows.txt
      - uses: actions/upload-artifact@v5
        with:
          name: gui-windows
          path: |
            dist/*.zip
            dist/checksums-windows.txt
          retention-days: 7

  publish:
    needs: [verify, cli, gui-macos, gui-windows]
    # Never publishes on the workflow_dispatch rehearsal path: that run has no
    # tag, so there is nothing to attach a Release to.
    if: needs.verify.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' -o -name 'checksums-*.txt' \) \
            -exec mv {} release/ \;
          ls -la release
      # Uploaded HERE, and the homebrew job renders the formula's download URLs
      # for the same repository. Both are spelled out rather than left to a
      # default, because the two used to be decided separately — the upload fell
      # back to this repository, the formula's own default named the tap — and
      # the run where they disagreed was green everywhere: valid Ruby, real
      # sha256s, every job passing, with the 404 waiting for the first
      # `brew install` on a machine this project cannot see.
      # TestReleaseWorkflowUploadsWhereTheFormulaPoints holds the pair together.
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/*
          body: |
            ## Install

            **GUI (macOS)** — download the `.dmg`. It contains the CLI too, so
            nothing else is needed. The app is ad-hoc signed but **not
            notarized**: on first launch, right-click → Open, or run
            `xattr -cr /Applications/AgentHub.app`.

            **GUI (Windows, experimental)** — download the `.zip` for your
            architecture (amd64 or arm64), unzip anywhere, and keep
            `agenthub-gui.exe` and `agenthub.exe` in the same folder. These
            binaries are **not code-signed**: SmartScreen will warn on first
            run (More info → Run anyway). The Microsoft Edge WebView2 runtime
            is required; Windows 11 already has it, and most Windows 10
            machines receive it through Edge. See the README.txt inside the zip
            for details. The Windows support cross-compiles and is unit-tested
            but has never run on a real Windows machine — treat surprises as
            expected and report them.

            **CLI only** — download the `.tar.gz` for your platform and put
            `agenthub` somewhere on your `$PATH`.

            Verify downloads against `checksums-*.txt`.

  # Updates the Homebrew tap: the formula, and the skill that documents the CLI
  # the formula installs.
  #
  # A separate job on purpose. By the time it runs the Release is complete and
  # correct; a tap push that fails must not retract or re-cut it. It goes red
  # here instead, which is the honest signal — the release shipped, the tap did
  # not catch up.
  #
  # Opt-in by setting the HOMEBREW_TAP_REPO variable (e.g. dinstein/homebrew-
  # agenthub). Until it is set the job is SKIPPED and says so in the run
  # summary, rather than being silently absent. The token that goes with it is
  # required in `verify`, before anything is built.
  homebrew:
    needs: [verify, publish]
    if: needs.verify.outputs.tagged == 'true' && vars.HOMEBREW_TAP_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The same bytes the Release serves. Reading the checksums from the
      # artifact rather than re-hashing anything keeps one source for the sums
      # the formula pins.
      - uses: actions/download-artifact@v5
        with:
          name: cli
          path: cli
      - name: Render the formula
        env:
          # The same repository the publish job uploaded to, spelled the same
          # way. The script has its own default and so does release-local.sh;
          # leaving this to them would put three places in charge of a value
          # this workflow already knows, and the disagreement is only ever
          # discovered by somebody installing.
          HOMEBREW_SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out
          scripts/homebrew-formula.sh "${GITHUB_REF_NAME}" cli/checksums-cli.txt > out/agenthub.rb
          cat out/agenthub.rb
      - name: Push it to the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP_REPO }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${TAP}.git" tap
          # Which files go to the tap, and that they arrive as one commit, is
          # decided in one place shared with the local release path — see the
          # header of scripts/tap-sync.sh.
          scripts/tap-sync.sh tap "${GITHUB_REF_NAME}" out/agenthub.rb
