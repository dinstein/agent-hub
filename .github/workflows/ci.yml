name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      # golangci-lint must be installed BEFORE `make test`: the depguard
      # proof test (internal/depguardtest) skips itself when the binary is
      # absent, and a skipped proof is no proof (canonical.md §6).
      - name: Install golangci-lint v2.12.2
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: make build
      - name: Test
        run: make test
      # The same target `make ci-full` runs, not a copy of its contents. The
      # copy that used to be here was the reason a change to one of them could
      # leave the other behind — and this check is the one where that matters
      # most, since a proof that stopped proving looks exactly like a proof.
      - name: Verify depguard proof was not skipped
        run: make ci-depguard-proof
      - name: Lint
        run: make lint
      # There is no Windows runner here and nothing in this project has ever
      # executed on Windows. This step is the whole of what stands between that
      # and a Windows build quietly rotting — which is what was happening:
      # README.md, docs/architecture.md and docs/windows.md all claimed CI
      # gated on GOOS=windows, and nothing anywhere did. It costs seconds, so
      # it runs on both matrix legs rather than being pinned to one.
      - name: Cross-compile and vet for Windows
        run: make cross-windows

  # The GUI job is SEPARATE from `ci` on purpose: "the GUI is optional by
  # construction" is a compile-time property (canonical.md §7 item 3), so it
  # must never become a prerequisite of the default build. `make ci` above
  # still covers the untagged half of the GUI — `go test ./...` builds and
  # tests cmd/agenthub-gui/services (the whole service body: api calls, SSE
  # bridge, dialer) and internal/healthgen's golden test on both runners.
  # What is left uncovered without this job is exactly the tagged shell plus
  # the frontend, and wails v3 is an alpha whose API does change.
  #
  # Why macOS: on Linux, `-tags wails` pulls in pkg/application's cgo
  # preamble (`#cgo pkg-config: gtk4 webkitgtk-6.0`), which cgo resolves
  # during type-checking — so even `go vet` fails on a bare ubuntu runner,
  # not just the link step. The fix would be apt-installing GTK/WebKit on
  # every run; the macOS runner already carries the Cocoa/WebKit SDK and
  # needs zero package installation, so the same signal costs nothing extra.
  gui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: cmd/agenthub-gui/frontend/package-lock.json
      # Must run first: gui_main.go embeds frontend/dist, and the directory
      # is gitignored — every Go step below fails to load the package until
      # the bundle exists. `npm run build` is `tsc --noEmit && vite build`.
      - name: Frontend (typecheck + bundle)
        run: make gui-frontend-ci
      - name: Build the Wails-tagged binary
        run: make gui-go
      # `make gui-vet`, not the bare `go vet`: `make ci-full` runs the same
      # target, so the local pre-push check and this job cannot drift into
      # vetting different things.
      - name: Vet the Wails-tagged code
        run: make gui-vet
      # The Windows GUI, cross-compiled here rather than in the `ci` job
      # because it needs the bundle two steps up. It is the shipped artifact's
      # compile check: the release workflow packages this same binary, and
      # wails v3's Windows backend is pure Go, so this runner produces exactly
      # what a Windows one would.
      - name: Cross-compile the Wails-tagged GUI for Windows
        run: make cross-windows-gui
